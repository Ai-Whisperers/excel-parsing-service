name: CI - Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install Python dependencies
      working-directory: ./python-layer
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Install test dependencies
      run: |
        pip install pytest pytest-cov pytest-asyncio

    - name: Build Java layer
      working-directory: ./java-layer
      run: mvn clean package -DskipTests

    - name: Run Java layer tests
      working-directory: ./java-layer
      run: mvn test

    - name: Run Python layer tests
      working-directory: ./python-layer
      run: pytest tests/ -v --cov=app

    - name: Run integration test suite
      run: |
        cd tests
        pytest python/ -v --cov-report=term-missing

    - name: Verify Docker builds
      run: |
        docker build -t excel-parser-java:test ./java-layer
        docker build -t excel-parser-python:test ./python-layer
