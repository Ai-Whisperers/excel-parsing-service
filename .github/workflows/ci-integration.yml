name: CI - Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build images
      run: |
        docker build -t excel-parser-java:test ./java-layer
        docker build -t excel-parser-python:test ./python-layer

    - name: Start services
      run: docker-compose -f docker-compose.yml up -d

    - name: Wait for services
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8080/api/v1/excel/health; do sleep 2; done'
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

    - name: Run integration tests
      run: |
        chmod +x tests/integration-tests.sh
        ./tests/integration-tests.sh

    - name: Cleanup
      if: always()
      run: docker-compose down -v
