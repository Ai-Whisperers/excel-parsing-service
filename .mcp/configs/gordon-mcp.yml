# Docker AI (Gordon) MCP Configuration
# Auto-detected by Docker Desktop's AI assistant

version: "1.0"

services:
  # Filesystem server - Access Excel files and project code
  filesystem:
    image: mcp/filesystem
    description: "Access Excel files (.xls, .xlsx) and project source code"
    volumes:
      - ../..:/workspace:ro  # Read-only access to project root
    allowed_paths:
      - /workspace/data
      - /workspace/java-layer
      - /workspace/python-layer
      - /workspace/local
    allowed_extensions:
      - .xlsx
      - .xls
      - .java
      - .py
      - .json
      - .yml
      - .yaml
      - .md

  # Fetch server - Test HTTP endpoints
  fetch:
    image: mcp/fetch
    description: "Test Java (8080) and Python (8000) layer APIs"
    allowed_domains:
      - localhost:8080
      - localhost:8000
      - 127.0.0.1:8080
      - 127.0.0.1:8000
    timeout: 300

  # Custom Excel parser MCP server
  excel-parser:
    build: ../servers/excel-parser
    description: "Parse Excel files using two-layer architecture"
    environment:
      JAVA_LAYER_URL: http://localhost:8080
      PYTHON_LAYER_URL: http://localhost:8000
      LOG_LEVEL: INFO
    depends_on:
      - java-layer
      - python-layer
    networks:
      - excel-parser-network

  # Feedback analyzer MCP server
  feedback-analyzer:
    build: ../servers/feedback-analyzer
    description: "Analyze customer feedback from Excel files"
    environment:
      PYTHON_LAYER_URL: http://localhost:8000
      LOG_LEVEL: INFO
    depends_on:
      - python-layer
    networks:
      - excel-parser-network

networks:
  excel-parser-network:
    external: true
    name: excel-parser-network

# Usage examples:
# docker ai "Parse the Excel file at data/sample.xlsx and return JSON"
# docker ai "Check the health status of both Java and Python layers"
# docker ai "List all sheets in workbook.xlsx"
# docker ai "Extract cells A1:D10 from the Sales sheet"
