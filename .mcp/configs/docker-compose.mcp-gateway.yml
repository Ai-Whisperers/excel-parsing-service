# MCP Gateway - Production deployment for AI clients
# Supports Claude Desktop, Cursor, VSCode, and other MCP clients

version: '3.8'

services:
  # MCP Gateway - Central hub for all MCP servers
  mcp-gateway:
    image: mcp/gateway:latest
    container_name: excel-parser-mcp-gateway
    ports:
      - "9090:9090"  # MCP Gateway API
    volumes:
      - ./mcp-catalog.yaml:/app/catalog.yaml:ro
      - ../../data:/workspace/data:ro
    environment:
      - MCP_CATALOG_PATH=/app/catalog.yaml
      - LOG_LEVEL=INFO
      - GATEWAY_PORT=9090
      - TRANSPORT=sse
    networks:
      - excel-parser-network
    depends_on:
      - excel-parser-server
      - feedback-analyzer-server
      - filesystem-server
      - fetch-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Custom Excel Parser MCP Server
  excel-parser-server:
    build:
      context: ../servers/excel-parser
      dockerfile: Dockerfile
    container_name: excel-parser-mcp-server
    environment:
      - JAVA_LAYER_URL=http://host.docker.internal:8080
      - PYTHON_LAYER_URL=http://host.docker.internal:8000
      - LOG_LEVEL=INFO
    volumes:
      - ../../data:/workspace/data:ro
    networks:
      - excel-parser-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Feedback Analyzer MCP Server
  feedback-analyzer-server:
    build:
      context: ../servers/feedback-analyzer
      dockerfile: Dockerfile
    container_name: feedback-analyzer-mcp-server
    environment:
      - PYTHON_LAYER_URL=http://host.docker.internal:8000
      - LOG_LEVEL=INFO
    volumes:
      - ../../data:/workspace/data:ro
    networks:
      - excel-parser-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Filesystem MCP Server
  filesystem-server:
    image: mcp/filesystem:latest
    container_name: excel-parser-filesystem-server
    volumes:
      - ../../:/workspace:ro  # Read-only access to project root
    environment:
      - ALLOWED_PATHS=/workspace/data,/workspace/java-layer,/workspace/python-layer,/workspace/local
      - ALLOWED_EXTENSIONS=.xlsx,.xls,.java,.py,.json,.yml,.yaml,.md
      - LOG_LEVEL=INFO
    networks:
      - excel-parser-network
    restart: unless-stopped

  # Fetch MCP Server
  fetch-server:
    image: mcp/fetch:latest
    container_name: excel-parser-fetch-server
    environment:
      - ALLOWED_DOMAINS=localhost:8080,localhost:8000,127.0.0.1:8080,127.0.0.1:8000,host.docker.internal:8080,host.docker.internal:8000
      - TIMEOUT=300
      - LOG_LEVEL=INFO
    networks:
      - excel-parser-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  excel-parser-network:
    external: true
    name: excel-parser-network

# Usage:
# 1. Start the gateway:
#    docker-compose -f .mcp/configs/docker-compose.mcp-gateway.yml up -d
#
# 2. Configure your AI client (Claude Desktop):
#    Add to %APPDATA%\Claude\claude_desktop_config.json:
#    {
#      "mcpServers": {
#        "excel-poi-parser": {
#          "url": "http://localhost:9090",
#          "transport": "sse"
#        }
#      }
#    }
#
# 3. Check status:
#    docker-compose -f .mcp/configs/docker-compose.mcp-gateway.yml ps
#
# 4. View logs:
#    docker-compose -f .mcp/configs/docker-compose.mcp-gateway.yml logs -f
#
# 5. Stop the gateway:
#    docker-compose -f .mcp/configs/docker-compose.mcp-gateway.yml down
