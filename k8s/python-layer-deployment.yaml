apiVersion: apps/v1
kind: Deployment
metadata:
  name: excel-parser-python
  namespace: excel-parser
  labels:
    app: excel-parser-python
    layer: python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: excel-parser-python
  template:
    metadata:
      labels:
        app: excel-parser-python
        layer: python
    spec:
      containers:
      - name: python-layer
        image: excel-parser-python:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8815
          name: flight-grpc
        env:
        - name: JAVA_LAYER_URL
          value: "http://java-layer:8080"
        - name: FLIGHT_HOST
          value: "0.0.0.0"
        - name: FLIGHT_PORT
          value: "8815"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: python-layer
  namespace: excel-parser
  labels:
    app: excel-parser-python
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 8815
    targetPort: 8815
    protocol: TCP
    name: flight-grpc
  selector:
    app: excel-parser-python
---
apiVersion: v1
kind: Service
metadata:
  name: excel-parser-service
  namespace: excel-parser
  labels:
    app: excel-parser-python
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
    protocol: TCP
    name: http
  - port: 8815
    targetPort: 8815
    nodePort: 30815
    protocol: TCP
    name: flight-grpc
  selector:
    app: excel-parser-python
