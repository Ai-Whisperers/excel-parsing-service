apiVersion: apps/v1
kind: Deployment
metadata:
  name: excel-parser-java
  namespace: excel-parser
  labels:
    app: excel-parser-java
    layer: java
spec:
  replicas: 2
  selector:
    matchLabels:
      app: excel-parser-java
  template:
    metadata:
      labels:
        app: excel-parser-java
        layer: java
    spec:
      containers:
      - name: java-layer
        image: excel-parser-java:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/v1/excel/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/excel/health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: java-layer
  namespace: excel-parser
  labels:
    app: excel-parser-java
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: excel-parser-java
